<style id="toolbar-planimetria-fix">
body.pagina-secondaria .controlli-planimetria {
  position: relative !important;
  inset: auto !important;
  z-index: 10 !important;
  display: flex !important;
  visibility: visible !important;
  opacity: 1 !important;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 6px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  margin: 14px auto 24px;
  padding: 8px;
  border: 1px solid rgba(22, 75, 112, .15);
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 3px 14px rgba(20, 42, 58, .12);
}
body.pagina-secondaria .controlli-planimetria button,
body.pagina-secondaria .controlli-planimetria .controllo-download {
  position: relative;
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  min-width: 38px;
  min-height: 38px;
  padding: 0 10px;
  border: 1px solid #d8e0e5;
  border-radius: 7px;
  background: #f7f5ef;
  color: #164b70;
  font: inherit;
  text-decoration: none;
  cursor: pointer;
}
body.pagina-secondaria .controlli-planimetria button:hover,
body.pagina-secondaria .controlli-planimetria .controllo-download:hover {
  background: #D7A35C;
  border-color: #D7A35C;
  color: #172b3a;
}
body.pagina-secondaria .controlli-planimetria .controllo-download svg {
  display: block;
  width: 20px;
  height: 20px;
}
body.pagina-secondaria .zoom-container {
  clear: both;
}
body.pagina-secondaria .zoom-container:fullscreen .controlli-planimetria,
body.pagina-secondaria .zoom-container.planimetria-fullscreen-attiva .controlli-planimetria {
  position: absolute !important;
  top: max(10px, env(safe-area-inset-top)) !important;
  right: max(10px, env(safe-area-inset-right)) !important;
  left: max(10px, env(safe-area-inset-left)) !important;
  width: auto !important;
  margin: 0 !important;
}
</style>


<style id="toolbar-icone-allineate">

  vertical-align: middle;
}
body.pagina-secondaria .controlli-planimetria .controllo-download svg {
  display: block;

}
